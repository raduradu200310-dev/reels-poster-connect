<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow"><meta name="referrer" content="no-referrer">
<title>Connect account</title>
<style>
:root{--bg:#0A0B0D;--s1:#141519;--line:#24272E;--ink:#ECEDEF;--ink2:#A5A9B4;--acc:#FF3D5A;--acc2:#FF7A45;--ok:#57C08F;--bad:#EF6B6B}
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--ink);font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;padding:16px}
.card{width:100%;max-width:440px;background:var(--s1);border:1px solid var(--line);border-radius:18px;padding:26px 22px;display:grid;gap:14px;text-align:center;position:relative;overflow:hidden}
.card:before{content:"";position:absolute;inset:0 0 auto 0;height:2px;background:linear-gradient(90deg,transparent,var(--acc),var(--acc2),var(--acc),transparent)}
h1{margin:0;font-size:22px}p{margin:0;color:var(--ink2)}
.code{font:600 12px ui-monospace,Menlo,monospace;background:#0F1013;border:1px solid var(--line);border-radius:10px;padding:10px;word-break:break-all;max-height:90px;overflow:auto;text-align:left;color:var(--ink2)}
button{border:0;border-radius:14px;padding:16px;font:800 17px -apple-system,system-ui,sans-serif;color:#fff;background:linear-gradient(110deg,#FF3D5A,#FF5A4E 55%,#FF7A45);cursor:pointer}
.ok{color:var(--ok);font-weight:700}.bad{color:var(--bad)}
</style></head><body><main class="card" id="c"></main>
<script>
(function(){
  var q=new URLSearchParams(location.search), c=document.getElementById("c");
  var code=(q.get("code")||"").replace(/#_$/,""), err=q.get("error_description")||q.get("error_message")||q.get("error");
  var kind=(q.get("state")||"").indexOf("fb")===0?"Facebook":"Instagram";
  if(err){c.innerHTML='<h1>Not connected</h1><p class="bad"></p><p>Go back to the tracker and press Connect again.</p>';c.querySelector(".bad").textContent=err;return;}
  if(!code){c.innerHTML='<h1>Reels Poster</h1><p>This page only shows your connect code after you press Connect in the tracker.</p>';return;}
  var text=(kind==="Facebook"?"FB:":"IG:")+code, st=q.get("state")||"", m=st.match(/^(?:ig|fb)\.([A-Za-z0-9_-]{20,64})$/);
  history.replaceState(null,"",location.pathname);
  if(m){
    c.innerHTML='<h1>Linking…</h1><p>One second.</p>';
    fetch("https://ntfy.sh/"+m[1],{method:"POST",body:text}).then(function(r){if(!r.ok)throw 0;
      c.innerHTML='<h1>'+kind+' linked ✓</h1><p>It shows up in your tracker (Auto-post) within about 2 minutes. You can close this page.</p>';
    }).catch(function(){showCode();});
    return;
  }
  showCode();
  function showCode(){
  c.innerHTML='<h1>'+kind+' approved ✓</h1><p>Copy this code and paste it on the Auto-post page in your tracker (Paste the code). It works once, within 1 hour.</p><div class="code"></div><button id="b">Copy code</button><p id="m"></p>';
  c.querySelector(".code").textContent=text;
  document.getElementById("b").onclick=function(){navigator.clipboard.writeText(text).then(function(){var m=document.getElementById("m");m.className="ok";m.textContent="Copied. Now paste it in the tracker.";},function(){var r=document.createRange();r.selectNodeContents(c.querySelector(".code"));var s=getSelection();s.removeAllRanges();s.addRange(r);document.getElementById("m").textContent="Select-all is on: press Copy.";});};
  }
})();
</script></body></html>
